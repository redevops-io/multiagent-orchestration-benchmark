name: cybergym-e2e
# Manual only. Runs the pinned upstream CyberGym-E2E harness on a DEDICATED, ISOLATED self-hosted runner and scores the result with cybergym_e2e/report.py. It has not been executed: no such runner exists
# yet (see cybergym_e2e/README.md). Every prerequisite below fails the run if it is missing; nothing is skipped silently. Never run it on a GitHub-hosted or shared runner.
#
# Prerequisites (all of them, set up by a person before the first dispatch):
#   * a self-hosted runner labelled `cybergym-isolated` that is used for nothing else, is rebuilt between runs, has Docker, and can only reach the LLM endpoint, Hugging Face and the container registries
#     it needs to pull images (the AGENT's network is limited separately, by upstream's firewall, below);
#   * a protected environment `cybergym-e2e` with required reviewers, holding HF_TOKEN (a token that accepted the dataset terms), LITELLM_MASTER_KEY, the variable LITELLM_BASE_URL (the LiteLLM proxy the
#     agent reaches; its host is the one remote domain the firewall allows), and AGE_RECIPIENT (the age public key the artifact bundle is encrypted to; the private key never lives here);
#   * RUNNER_ISOLATED=true set on that runner, which is the runner owner's statement that the previous point holds.
on:
  workflow_dispatch:
    inputs:
      arm:
        description: "Arm to run (only upstream scaffolds exist today)"
        type: choice
        options: [single-upstream-claude-code]
        default: single-upstream-claude-code
      tasks:
        description: "Task selection file under cybergym_e2e/pilot/"
        default: pilot-1.json
      agent_timeout_sec:
        default: "5400"
      litellm_model_id:
        description: "LiteLLM model id (e.g. openai/<model>). The run goes through a LiteLLM proxy because upstream enforces its per-task budget (a fixed 10 USD) only through a LiteLLM key"
        required: true
      max_parallel:
        default: "2"
      llm_endpoint_domain:
        description: "Host of the LiteLLM proxy to allow through the firewall (required unless the proxy is on the runner host)"
        default: ""
permissions:
  contents: read
concurrency:
  group: cybergym-e2e
  cancel-in-progress: false
jobs:
  run:
    runs-on: [self-hosted, linux, cybergym-isolated]
    environment: cybergym-e2e
    timeout-minutes: 720
    steps:
      - name: Refuse to run anywhere but the dedicated runner
        run: |
          [ "${RUNNER_ISOLATED:-}" = "true" ] || { echo "RUNNER_ISOLATED is not true: this workflow runs only on the dedicated isolated runner" >&2; exit 1; }
          [ -n "${AGE_RECIPIENT:-}" ] || { echo "AGE_RECIPIENT is not set: artifacts are encrypted or not produced" >&2; exit 1; }
          [ -n "${HF_TOKEN:-}" ] || { echo "HF_TOKEN is not set" >&2; exit 1; }
          [ -n "${LITELLM_MASTER_KEY:-}" ] && [ -n "${LITELLM_BASE_URL:-}" ] || { echo "LITELLM_MASTER_KEY and LITELLM_BASE_URL are required: upstream's per-task cost cap exists only for LiteLLM keys" >&2; exit 1; }
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
      - uses: actions/checkout@v4
      - name: Read the pins
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open("cybergym_e2e/PINS.json"))
          print("upstream=" + p["upstream"]["revision"])
          print("dataset=" + p["dataset"]["revision"])
          PY
      - uses: actions/checkout@v4
        with:
          repository: sunblaze-ucb/cybergym-e2e
          ref: ${{ steps.pins.outputs.upstream }}
          path: upstream
      - name: Check the pinned upstream revision and task list
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "${{ steps.pins.outputs.upstream }}"
          python3 - <<'PY'
          import hashlib, json
          pins = json.load(open("cybergym_e2e/PINS.json"))
          h = hashlib.sha256(open("upstream/scripts/tasks.txt", "rb").read()).hexdigest()
          assert h == pins["upstream"]["tasks_sha256"], "upstream/scripts/tasks.txt is not the pinned task list"
          PY
      - name: Install dependencies
        run: |
          pip install tomli tomli_w anthropic openai boto3 httpx huggingface_hub docker
          sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Download the pinned dataset
        run: hf download sunblaze-ucb/cybergym-e2e --repo-type dataset --revision "${{ steps.pins.outputs.dataset }}" --local-dir upstream/data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Pull images and record their digests
        working-directory: upstream
        run: |
          python scripts/pull_images.py
          python3 - <<'PY'
          import json, subprocess
          # one digest per task image the run will use: recorded, then frozen for later runs
          tasks = json.load(open("../cybergym_e2e/pilot/${{ inputs.tasks }}"))["tasks"]
          out = {}
          for t in tasks:
              imgs = subprocess.run(["docker", "images", "--digests", "--format", "{{.Repository}}:{{.Tag}} {{.Digest}}"], capture_output=True, text=True, check=True).stdout.splitlines()
              out[t] = "; ".join(sorted(i for i in imgs if t.split("/")[1].split("_")[-1] in i))[:2000] or ""
          json.dump(out, open("../image_digests.json", "w"), indent=2, sort_keys=True)
          missing = [t for t, v in out.items() if not v]
          assert not missing, f"no image digest found for: {missing}"
          PY
      - name: Start the agent firewall (on by default upstream; never --no-firewall)
        working-directory: upstream
        run: |
          docker pull ubuntu/squid:latest
          cd scripts
          if [ -n "${{ inputs.llm_endpoint_domain }}" ]; then python -m firewall start --domain "${{ inputs.llm_endpoint_domain }}"; else python -m firewall start; fi
          python -m firewall status
      - name: Run both modes (one attempt per task)
        working-directory: upstream
        run: |
          python3 -c "import json; print('\n'.join(json.load(open('../cybergym_e2e/pilot/${{ inputs.tasks }}'))['tasks']))" > ../tasks_selected.txt
          for MODE in e2e patch-only; do
            MODE=$MODE MAX_PARALLEL=${{ inputs.max_parallel }} MAX_ATTEMPTS=1 USE_FIREWALL=1 TIMEOUT=${{ inputs.agent_timeout_sec }} \
              MODEL_PROVIDER=litellm LITELLM_MODEL_ID="${{ inputs.litellm_model_id }}" AGENT_OUTPUT_DIR="$PWD/../agent_output" bash scripts/batch_run.sh ../tasks_selected.txt
          done
        env:
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          LITELLM_BASE_URL: ${{ vars.LITELLM_BASE_URL }}
      - name: Assemble results.json from the runner's run directories
        run: |
          # upstream writes one summary.json per task and mode and no combined results.json; this builds the submission-format file and the infrastructure sidecar
          python3 cybergym_e2e/assemble_results.py --agent-output agent_output --planned "cybergym_e2e/pilot/${{ inputs.tasks }}" --out results.json --infra-out infra.json || echo "the assembler reported problems: they are in the log and the run is not conformant" >&2
          test -f results.json || { echo "no results.json: the run is not_tested" >&2; exit 1; }
      - name: Manifest, report and leakage audit
        run: |
          python3 cybergym_e2e/make_manifest.py --arm "${{ inputs.arm }}" --run-id "${{ github.run_id }}-${{ github.run_attempt }}" --models "${{ inputs.litellm_model_id }}" --provider "$PROVIDER" \
            --timeout-s "${{ inputs.agent_timeout_sec }}" --cost-cap-usd 10 --runner-image-digest "$RUNNER_IMAGE_DIGEST" \
            --start "$(date -u +%FT%TZ)" --end "$(date -u +%FT%TZ)" --result-uri "run:${{ github.run_id }}" --results results.json --image-digests image_digests.json \
            --planned "cybergym_e2e/pilot/${{ inputs.tasks }}" --allowlist "$(cat upstream/scripts/firewall/default_allowlist.txt | tr '\n' ' ')" ${{ inputs.llm_endpoint_domain }} \
            --firewall true --provider-tools-disabled false --out manifest.json
          # --provider-tools-disabled is recorded as FALSE until the scaffold's tool list is audited: the report then says the run is not conformant, which is the honest state.
          if [ -f leakage.json ]; then LEAK="--leakage leakage.json"; else LEAK=""; echo "no leakage audit was produced for this scaffold: the run cannot be protocol-conformant" >&2; fi
          python3 cybergym_e2e/report.py --results results.json --manifest manifest.json --planned "cybergym_e2e/pilot/${{ inputs.tasks }}" --infra infra.json $LEAK --out report.json
        env:
          PROVIDER: ${{ vars.CYBERGYM_PROVIDER }}
          RUNNER_IMAGE_DIGEST: ${{ vars.CYBERGYM_RUNNER_IMAGE_DIGEST }}
      - name: Encrypt the bundle (it holds agent outputs and trajectories)
        run: |
          tar czf bundle.tgz results.json infra.json manifest.json report.json image_digests.json agent_output
          age -r "$AGE_RECIPIENT" -o bundle.tgz.age bundle.tgz
          rm -f bundle.tgz
        env:
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
      - uses: actions/upload-artifact@v4
        with:
          name: cybergym-e2e-${{ github.run_id }}
          path: |
            bundle.tgz.age
            report.json
            manifest.json
          retention-days: 14
      - name: Tear down the firewall
        if: always()
        working-directory: upstream/scripts
        run: python -m firewall stop-all
