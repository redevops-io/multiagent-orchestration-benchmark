name: tests
# Runs the deterministic gates against the reference solutions (offline: no model calls, no API keys).
on:
  pull_request:
  push:
    branches: ["master"]
permissions:
  contents: read
jobs:
  validate-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install kotlinc
        run: |
          set -euo pipefail
          curl -fsSL -o kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip"
          unzip -q kotlin.zip -d "$RUNNER_TEMP"
          mkdir -p "$HOME/.local"
          mv "$RUNNER_TEMP/kotlinc" "$HOME/.local/kotlinc"
          rm kotlin.zip
      - run: python validate_gates.py
